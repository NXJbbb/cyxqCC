<title>创业星球 v6.4 · 现场版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23070D13' stroke='%23F2A63C' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.6' fill='%23F2A63C'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
:root{
  --bg:#070D13;
  --panel:#0C151D;
  --panel2:#101B25;
  --line:rgba(232,237,241,.10);
  --line2:rgba(232,237,241,.055);
  --ink:#E8EDF1;
  --dim:#8A98A5;
  --dim2:#5A6875;
  --amber:#F2A63C;
  --amber-d:#B87A22;
  --mint:#6FD9BE;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  color:var(--ink);
  font-family:var(--sans);
  font-weight:400;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;inset:0;
  background:
    radial-gradient(620px 380px at 78% -8%, rgba(242,166,60,.13), transparent 62%),
    radial-gradient(520px 420px at 6% 8%, rgba(111,217,190,.05), transparent 66%);
  pointer-events:none;
  z-index:0;
}
#app{position:relative;z-index:2}
.shell{max-width:460px;margin:0 auto;padding:0 22px 108px;min-height:100vh}
.serif{font-family:var(--serif)}

/* ---------- 顶部 ---------- */
.top{padding:30px 0 0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.top .meta{font-size:11.5px;color:var(--dim2);letter-spacing:.06em;margin-bottom:10px}
.top h1{
  font-family:var(--serif);font-weight:600;font-size:29px;line-height:1.28;
  margin:0;letter-spacing:-.01em;
}
.top .sub{font-size:12.5px;color:var(--dim);margin-top:9px;line-height:1.6;max-width:220px}

/* ---------- 轨道环 ---------- */
.ring{flex:none;width:104px;height:104px;position:relative;margin-top:2px}
.ring svg{display:block;width:104px;height:104px}
.ring .core{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;
}
.ring .core b{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1;color:var(--ink)}
.ring .core span{font-size:9.5px;color:var(--dim2);letter-spacing:.08em;margin-top:4px}

/* ---------- 通用区块 ---------- */
.sec{margin-top:38px}
.sec-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.sec-hd h2{font-family:var(--serif);font-weight:600;font-size:15.5px;margin:0;letter-spacing:.01em}
.sec-hd .note{font-size:11px;color:var(--dim2)}

/* ---------- 任务 ---------- */
.tasks{margin-top:2px}
.task{display:flex;gap:13px;align-items:flex-start;padding:17px 0 16px;border-bottom:1px solid var(--line2);cursor:pointer;transition:opacity .18s}
.task:active{opacity:.6}
.task .no{font-family:var(--serif);font-size:12.5px;color:var(--dim2);width:15px;flex:none;padding-top:3px}
.task .body{flex:1;min-width:0}
.task .body p{margin:0;font-size:14.5px;line-height:1.62;color:var(--ink);transition:color .18s}
.task .box{
  width:19px;height:19px;flex:none;border:1px solid rgba(232,237,241,.22);
  display:grid;place-items:center;margin-top:2px;transition:border-color .18s,background .18s;
}
.task .box svg{width:11px;height:11px;opacity:0;transition:opacity .18s}
.task.on .box{border-color:var(--mint);background:rgba(111,217,190,.10)}
.task.on .box svg{opacity:1}
.task.on .body p{color:var(--dim2);text-decoration:line-through;text-decoration-color:rgba(140,155,168,.5);text-decoration-thickness:1px}

/* ---------- 完成态 ---------- */
.finish{
  margin-top:26px;border:1px solid rgba(111,217,190,.28);background:rgba(111,217,190,.05);
  padding:18px 18px 17px;display:flex;gap:13px;align-items:flex-start;
}
.finish .mark{color:var(--mint);font-size:13px;font-family:var(--serif);flex:none;padding-top:1px}
.finish .txt{font-size:13px;line-height:1.7;color:#CFE9E2}
.finish .txt b{font-family:var(--serif);font-size:15px;display:block;margin-bottom:5px;color:#EAF7F4;font-weight:600}

/* ---------- 诊断 ---------- */
.diag{border:1px solid var(--line);background:linear-gradient(180deg,rgba(242,166,60,.06),rgba(242,166,60,.015));padding:20px 18px 16px;margin-top:26px}
.diag .tag{font-size:10.5px;color:var(--amber);letter-spacing:.12em;margin-bottom:12px}
.diag p{margin:0 0 9px;font-size:13px;line-height:1.72;color:#D6DDE3}
.diag p b{color:var(--amber);font-weight:500}
.diag button{
  margin-top:8px;background:none;border:0;padding:6px 0;color:var(--dim);
  font-family:var(--sans);font-size:11.5px;cursor:pointer;letter-spacing:.04em;
}

/* ---------- 今日一句 ---------- */
.intel{margin-top:2px}
.intel .row{padding:17px 0 15px;border-bottom:1px solid var(--line2)}
.intel .tag{display:inline-block;font-size:10.5px;color:var(--dim);border:1px solid var(--line);padding:2px 7px;margin-bottom:9px;letter-spacing:.05em}
.intel h3{font-family:var(--serif);font-weight:600;font-size:14px;margin:0 0 6px;line-height:1.5}
.intel p{margin:0;font-size:12.8px;line-height:1.72;color:var(--dim)}
.intel .src{display:block;margin-top:8px;font-size:10.5px;color:var(--dim2)}

/* ---------- 路径 ---------- */
.week{margin-top:30px}
.week-hd{display:flex;align-items:baseline;gap:11px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.week-hd .wnum{font-family:var(--serif);font-size:12px;color:var(--amber);letter-spacing:.04em}
.week-hd h3{font-family:var(--serif);font-weight:600;font-size:15px;margin:0}
.day{border-bottom:1px solid var(--line2);cursor:pointer}
.day-hd{display:flex;gap:13px;align-items:baseline;padding:13px 0}
.day-hd .dn{font-family:var(--serif);font-size:12px;color:var(--dim2);width:26px;flex:none}
.day-hd .dt{font-size:13.5px;line-height:1.55;flex:1;color:var(--ink)}
.day-hd .st{font-size:10px;flex:none;color:var(--dim2);letter-spacing:.04em}
.day.now .day-hd .dn,.day.now .day-hd .dt{color:var(--amber)}
.day.now .day-hd .st{color:var(--amber)}
.day.done .day-hd .dt{color:var(--dim2)}
.day.done .day-hd .st{color:var(--mint)}
.day .sub{padding:0 0 15px 39px;display:none}
.day.open .sub{display:block}
.day .sub .t{display:flex;gap:9px;padding:6px 0;font-size:12.5px;line-height:1.6;color:var(--dim)}
.day .sub .t i{font-style:normal;color:var(--dim2);flex:none;font-size:11px}
.day .sub .t.on{color:var(--dim2);text-decoration:line-through;text-decoration-color:rgba(140,155,168,.4)}

/* ---------- 星球 ---------- */
.lede{font-size:13px;line-height:1.75;color:var(--dim);margin:16px 0 0;max-width:340px}
.lede b{color:var(--ink);font-weight:500}
.people{margin-top:26px}
.person{display:flex;gap:13px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line2)}
.person .av{width:32px;height:32px;flex:none;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--serif);font-size:12px;color:var(--dim)}
.person .who{flex:1;min-width:0}
.person .who strong{display:block;font-size:13px;font-weight:500}
.person .who span{font-size:11px;color:var(--dim2)}
.person .pct{font-family:var(--serif);font-size:11px;color:var(--dim)}
.notice{border:1px solid var(--line);padding:19px 17px 15px;margin-top:30px}
.notice .tag{font-size:10.5px;color:var(--amber);letter-spacing:.12em;margin-bottom:11px}
.notice h3{font-family:var(--serif);font-weight:600;font-size:14px;margin:0 0 8px}
.notice p{margin:0 0 8px;font-size:12.5px;line-height:1.75;color:var(--dim)}
.btn-line{
  display:block;width:100%;margin-top:12px;background:none;border:1px solid var(--line);
  color:var(--dim);font-family:var(--sans);font-size:12.5px;padding:12px;cursor:pointer;letter-spacing:.04em;
}
.btn-line:active{background:rgba(232,237,241,.04)}
.mseg{display:flex;margin-top:16px;border:1px solid var(--line)}
.mseg button{flex:1;background:none;border:0;border-right:1px solid var(--line);padding:11px 0;
 font-family:var(--sans);font-size:12.5px;color:var(--dim2);cursor:pointer}
.mseg button:last-child{border-right:0}
.mseg button.on{background:var(--accSoft);color:var(--amber)}
.mform{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.mform input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);
 font-family:var(--sans);font-size:13.5px;padding:12px;border-radius:0;-webkit-appearance:none;appearance:none}
.mform input:focus{outline:1px solid var(--accLine)}
.mrow2{display:flex;gap:10px}
.mrow2 input{flex:1.2;min-width:0}
.mform select{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--ink);
 font-family:var(--sans);font-size:13.5px;padding:12px;border-radius:0;-webkit-appearance:none;appearance:none}
.mform select:focus{outline:1px solid var(--accLine)}
.mrow{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line2)}
.mbox{width:20px;height:20px;flex:none;border:1px solid var(--line);background:none;color:var(--amber);
 font-size:12px;line-height:1;cursor:pointer;margin-top:2px}
.mrow .mt{flex:1;min-width:0}
.mtitle{font-size:13.5px;line-height:1.55}
.mtmeta{font-size:11px;color:var(--dim2);margin-top:4px}
.mrow.on .mtitle{color:var(--dim2);text-decoration:line-through}
.mrow .lnk{flex:none;align-self:center}

/* ---------- 我的 ---------- */
.profile{margin-top:2px}
.prow{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding:13px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.prow .k{color:var(--dim2);flex:none;line-height:1.75}
.prow .v{color:var(--ink);text-align:right;flex:1;min-width:0;line-height:1.7;word-break:break-word}
.grid30{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin-top:18px}
.g30{aspect-ratio:1/1;border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--serif);font-size:9px;color:var(--dim2)}
.g30.done{background:rgba(242,166,60,.16);border-color:rgba(242,166,60,.4);color:var(--amber)}
.g30.now{border-color:var(--amber);color:var(--amber)}
textarea{
  width:100%;min-height:112px;margin-top:14px;background:var(--panel);
  border:1px solid var(--line);color:var(--ink);font-family:var(--sans);font-size:13px;
  line-height:1.7;padding:13px;resize:vertical;border-radius:0;
}
textarea:focus{outline:1px solid rgba(242,166,60,.5);outline-offset:0}
.save{width:100%;margin-top:10px;background:rgba(242,166,60,.11);border:1px solid rgba(242,166,60,.35);color:var(--amber);font-family:var(--sans);font-size:12.5px;padding:12px;cursor:pointer;letter-spacing:.06em}
.save:active{background:rgba(242,166,60,.18)}
.mini{font-size:10.5px;color:var(--dim2);margin-top:9px;line-height:1.7}
.plans{display:flex;flex-direction:column}
.planrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;
  border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.planrow:last-child{border-bottom:0}
.planrow .pl{min-width:0}
.planrow .pn{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);line-height:1.4}
.planrow .pm{font-size:11px;color:var(--dim2);margin-top:5px;letter-spacing:.02em}
.planrow .pa{font-size:12px;color:var(--amber);flex:none}
.pill{flex:none;font-size:10px;padding:1px 6px;border:1px solid var(--accLine);color:var(--amber);letter-spacing:.04em}
.planrow .pin{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.pacts{display:flex;gap:14px;flex:none}
.lnk{background:none;border:0;padding:0;color:var(--dim2);font-size:11px;cursor:pointer;font-family:var(--sans)}
.lnk:active{color:var(--amber)}
textarea.ans{width:100%;margin-top:24px;background:var(--panel);border:1px solid var(--line);
 color:var(--ink);padding:16px;font-family:var(--sans);font-size:15px;line-height:1.75;
 resize:none;min-height:104px;border-radius:0}
textarea.ans::placeholder{color:var(--dim2)}
textarea.ans:focus{outline:1px solid var(--accLine)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:none;border:1px solid var(--line);color:var(--dim);font-size:12px;padding:8px 11px;
 line-height:1.2;cursor:pointer;font-family:var(--sans);text-align:left}
.chip:active{border-color:var(--accLine);color:var(--amber)}

/* ---------- 底部导航 ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:rgba(7,13,19,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabbar .inner{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
.tab{background:none;border:0;padding:6px 0 2px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--dim2);font-family:var(--sans);font-size:10.5px;letter-spacing:.02em}
.tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.4}
.tab.on{color:var(--amber)}

/* ---------- 问诊 ---------- */
.onb{max-width:460px;margin:0 auto;padding:34px 24px calc(34px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.onb .steps{display:flex;gap:6px;margin-bottom:34px}
.onb .steps i{height:2px;flex:1;background:var(--line);transition:background .3s}
.onb .steps i.on{background:var(--amber)}
.onb .qno{font-family:var(--serif);font-size:11px;color:var(--dim2);letter-spacing:.1em;margin-bottom:14px}
.onb h2{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.42;margin:0 0 26px;letter-spacing:-.01em}
.onb h2 em{font-style:normal;color:var(--amber)}
.opt{display:flex;justify-content:space-between;gap:14px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:17px 0 16px;color:var(--ink);font-family:var(--sans);font-size:14.5px;cursor:pointer;transition:padding-left .18s,color .18s}
.opt:active{padding-left:4px}
.opt.on{border-top-color:rgba(242,166,60,.42)}
.opt.on .lab{color:var(--amber)}
.opt .lab{flex:1;line-height:1.5}
.opt .desc{font-size:11px;color:var(--dim2);flex:none;max-width:130px;text-align:right;line-height:1.5}
.opt .mk{width:14px;flex:none;color:var(--amber);font-size:11px;opacity:0}
.opt.on .mk{opacity:1}
.onb .hint{font-size:11px;color:var(--dim2);line-height:1.7;margin-top:20px;max-width:290px}
.onb .foot{margin-top:28px;display:flex;gap:10px}
.onb .foot button{flex:1;padding:14px;font-family:var(--sans);font-size:13px;letter-spacing:.06em;cursor:pointer;border-radius:0}
.onb .ghost{background:none;border:1px solid var(--line);color:var(--dim)}
.onb .go{background:var(--amber);border:1px solid var(--amber);color:#120A00;font-weight:500}
.onb .go[disabled]{background:rgba(242,166,60,.22);border-color:transparent;color:rgba(242,166,60,.5);cursor:default}

/* ---------- 开场 ---------- */
.boot{max-width:460px;margin:0 auto;padding:0 26px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.boot .mark{width:56px;height:56px;margin-bottom:28px}
.boot h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.3;margin:0 0 16px;letter-spacing:-.01em}
.boot h1 em{font-style:normal;color:var(--amber)}
.boot p{font-size:13.5px;line-height:1.8;color:var(--dim);margin:0 0 10px;max-width:300px}
.boot .cta{margin-top:34px;display:flex;flex-direction:column;gap:10px}
.boot .cta button{padding:15px;font-family:var(--sans);font-size:13.5px;letter-spacing:.04em;cursor:pointer;border-radius:0}
.boot .primary{background:var(--amber);border:1px solid var(--amber);color:#120A00;font-weight:500}
.boot .secondary{background:none;border:1px solid var(--line);color:var(--dim)}
.boot .foot{margin-top:28px;font-size:10.5px;color:var(--dim2);line-height:1.7}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== 记录 / 选择器 / 笔记 / 统计 ===== */
.pf-need{font-size:11.5px;color:var(--dim2, #8a97a3);letter-spacing:.02em;margin-top:6px}
.pf-mini{font-size:11.5px;color:#6FD9BE;margin-top:6px;line-height:1.6}
.pf-dot{display:block;width:9px;height:9px;border-radius:50%;border:1px solid var(--dotIdle);margin:auto}
.proof{position:fixed;inset:0;z-index:30;background:rgba(3,7,11,.72);backdrop-filter:blur(6px);display:flex;align-items:flex-end}
.proof-box{width:100%;max-width:520px;margin:0 auto;background:var(--panel, #0C1520);border:1px solid var(--line);border-bottom:none;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.proof-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.proof-hd b{display:block;font-size:14px;letter-spacing:.02em;color:var(--ink)}
.proof-hd span{display:block;font-size:12px;color:var(--muted,#8a97a3);margin-top:5px;line-height:1.6}
.proof-body textarea,.proof-body input[type=number]{width:100%;background:var(--inputBg,rgba(255,255,255,.04));border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 12px;font:inherit;font-size:14px;line-height:1.7}
.pf-k{font-size:12px;color:var(--muted,#8a97a3);margin-bottom:8px}
.pf-txt{font-size:14px;line-height:1.8;color:var(--ink);white-space:pre-wrap}
.pf-meta{font-size:12px;color:var(--muted,#8a97a3);margin-top:8px}
.pf-row{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pf-row label{font-size:12px;color:var(--muted,#8a97a3)}
.pf-row input[type=number]{width:150px}
.pf-pick{display:inline-block;padding:9px 13px;border:1px dashed var(--line);border-radius:9px;font-size:12.5px;color:var(--ink)}
.pf-photo{margin-top:12px}
.pf-photo img{width:100%;max-height:38vh;object-fit:cover;border-radius:10px;display:block}
.pf-photo .lnk{margin-top:8px}
.pf-go{width:100%;margin-top:16px;padding:13px;background:var(--amber);color:#0A0F14;border:none;border-radius:11px;font-size:14.5px;font-weight:600;letter-spacing:.02em}
.pf-undo{width:100%;margin-top:16px;padding:12px;background:transparent;border:1px solid var(--line);color:#e0837f;border-radius:10px;font-size:13px}
.mini{font-size:11.5px;color:var(--muted,#7f8b97);line-height:1.8;margin-top:12px}
.pick{position:fixed;inset:0;z-index:28;background:rgba(3,7,11,.75);display:flex;align-items:flex-end}
.pick-box{width:100%;max-width:520px;margin:0 auto;background:var(--panel,#0C1520);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:86vh;display:flex;flex-direction:column}
.pick-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pick-hd b{display:block;font-size:15px}
.pick-hd span{display:block;font-size:11.5px;color:var(--muted,#8a97a3);margin-top:4px}
.pick-body{overflow:auto;margin-top:12px;padding-bottom:6px}
.pick-gn{font-size:11.5px;letter-spacing:.14em;color:var(--amber);margin:16px 0 8px}
.pick-items{display:flex;flex-wrap:wrap;gap:8px}
.pick-i{padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font-size:12.5px}
.pick-i.on{border-color:var(--amber);color:var(--amber)}
.pick-open{display:block;width:100%;margin-top:14px;padding:11px;border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--ink);font-size:13px}
.sound-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:12.5px;color:var(--muted,#8a97a3);border-bottom:1px solid var(--line)}
.sw2{display:inline-flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--ink);font-size:12px}
.sw2 i{width:22px;height:12px;border-radius:999px;background:var(--amber);position:relative;display:inline-block}
.sw2 i:after{content:"";position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:#0A0F14}
.sw2.off i{background:rgba(255,255,255,.18)}
.sw2.off i:after{right:auto;left:2px}
.back{background:transparent;border:none;color:var(--muted,#8a97a3);font-size:12.5px;padding:0 0 4px}
.nitem{border-bottom:1px solid var(--line);padding:16px 0}
.nhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nhead b{font-size:14.5px}
.nhead span{font-size:11.5px;color:var(--muted,#7f8b97);white-space:nowrap}
.nbody{font-size:13.5px;line-height:1.8;margin-top:8px;white-space:pre-wrap;color:var(--ink)}
.rrow{display:flex;gap:10px;font-size:13px;line-height:1.8;margin-top:6px}
.rrow i{flex:0 0 38px;font-style:normal;font-size:11.5px;color:var(--muted,#7f8b97);padding-top:2px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.statgrid .sg{background:var(--panel,#0C1520);padding:14px 12px}
.statgrid b{display:block;font-size:22px;font-weight:500;color:var(--amber)}
.statgrid span{display:block;font-size:11px;color:var(--muted,#7f8b97);margin-top:4px}
.stat-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12.5px}
.stat-table th{font-weight:400;font-size:11px;letter-spacing:.04em;color:var(--muted,#7f8b97);text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
.stat-table td{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.06);color:var(--ink)}
.stat-table tr.done td{color:var(--amber)}

/* ---------- v4 进门前 ---------- */
.startv{max-width:460px;margin:0 auto;padding:34px 22px calc(34px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column}
.start-k{font-size:10.5px;letter-spacing:.16em;color:var(--dim2);text-transform:uppercase}
.startv h1{font-family:var(--serif);font-size:34px;line-height:1.32;font-weight:600;margin:14px 0 14px;color:var(--ink)}
.startv .lead{font-size:13px;line-height:1.85;color:var(--dim);margin:0 0 24px}
.start-cards{display:flex;flex-direction:column;gap:9px}
.start-card{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px 14px;border:1px solid var(--line);background:rgba(12,21,29,.55);color:var(--ink);cursor:pointer}
.start-card.on{border-color:rgba(242,166,60,.55);background:rgba(242,166,60,.07)}
.start-card .dot{width:14px;height:14px;border:1px solid var(--dim2);border-radius:50%;flex:none;margin-top:3px;position:relative}
.start-card.on .dot{border-color:var(--amber)}
.start-card.on .dot:after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--amber)}
.start-card b{display:block;font-size:13.5px;font-weight:500;line-height:1.5}
.start-card small{display:block;font-size:11px;color:var(--dim2);line-height:1.6;margin-top:2px}
.start-label{display:block;font-size:11.5px;color:var(--dim2);margin:22px 0 8px}
.start-in{width:100%;min-height:78px;resize:vertical;background:rgba(12,21,29,.62);border:1px solid var(--line);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.7;padding:12px;border-radius:0}
.start-in:focus{outline:none;border-color:rgba(242,166,60,.55)}
.start-pick{display:block;width:100%;margin-top:8px;padding:10px;border:1px dashed var(--line);background:transparent;color:var(--dim);font-size:11.5px}
.start-go{width:100%;margin-top:14px;padding:14px;background:var(--amber);border:1px solid var(--amber);color:#0A1117;font-size:13.5px;font-weight:600;letter-spacing:.04em}
.start-later{display:block;width:100%;margin-top:12px;padding:8px;border:0;background:transparent;color:var(--dim2);font-size:11.5px;text-decoration:underline;text-underline-offset:3px}
.start-note{font-size:10.5px;line-height:1.75;color:var(--dim2);margin:14px 0 0}
.startv .fieldtag{display:inline-block;margin-top:8px;font-size:11px;color:var(--amber);border-bottom:1px solid rgba(242,166,60,.35);padding-bottom:2px}

/* ---------- v4 计划主权 ---------- */
.ownbar{margin-top:16px;border:1px solid var(--line);background:rgba(12,21,29,.5);padding:11px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.ownbar b{display:block;font-size:12px;color:var(--ink);font-weight:500}
.ownbar small{display:block;font-size:10.5px;line-height:1.6;color:var(--dim2);margin-top:2px}
.ownbar button{flex:none;border:1px solid rgba(242,166,60,.45);color:var(--amber);background:rgba(242,166,60,.08);padding:6px 9px;font-size:11px}
.whyline{margin-top:8px;font-size:10.5px;line-height:1.7;color:var(--dim);border-left:1px solid rgba(242,166,60,.45);padding-left:9px}
.whyline.warn{color:#D9A25C}
.pe-row{padding:13px 0;border-bottom:1px solid var(--line2)}
.pe-row label{display:block;font-size:10.5px;color:var(--dim2);letter-spacing:.06em;margin-bottom:6px}
.pe-row textarea{width:100%;background:rgba(7,13,19,.65);border:1px solid var(--line);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.7;padding:10px;resize:vertical}
.pe-row textarea:focus{outline:none;border-color:rgba(242,166,60,.5)}
.pe-note{font-size:10.5px;color:var(--dim2);line-height:1.7;margin:10px 0 0}
.hda{display:flex;gap:10px;align-items:center;flex:none}
.hda .lnk.save{color:var(--amber);border:1px solid rgba(242,166,60,.45);padding:5px 9px}
.hda .lnk{white-space:nowrap}

/* ---------- v4 账本 ---------- */
.ledger-intro{font-size:11px;line-height:1.8;color:var(--dim2);margin:4px 0 0}
.ledger-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:20px}
.ledger-grid .lg{background:rgba(12,21,29,.75);padding:13px 10px}
.ledger-grid b{display:block;font-family:var(--serif);font-size:20px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ledger-grid span{display:block;font-size:10px;color:var(--dim2);margin-top:3px}
.ledger-grid .lg.acc b{color:var(--amber)}
.ledger-sub{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-top:0}
.ledger-sub .lg{background:rgba(12,21,29,.75);padding:11px 10px}
.ledger-sub .lg b{display:block;font-family:var(--serif);font-size:15px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ledger-sub .lg span{display:block;font-size:9.5px;color:var(--dim2);margin-top:4px;line-height:1.5}
.ledger-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;border:1px solid var(--line);padding:12px}
.ledger-form .full{grid-column:1 / -1}
.ltype{display:flex;gap:1px;background:var(--line);border:1px solid var(--line)}
.ltype button{flex:1;padding:8px;border:0;background:rgba(7,13,19,.65);color:var(--dim);font-size:11.5px}
.ltype button.on{background:rgba(242,166,60,.13);color:var(--amber)}
.ledger-form input{width:100%;padding:9px;border:1px solid var(--line);background:rgba(7,13,19,.65);color:var(--ink);font-size:12px;font-family:var(--sans)}
.ledger-form input:focus{outline:none;border-color:rgba(242,166,60,.5)}
.ledger-form .lgadd{grid-column:1 / -1;padding:10px;border:1px solid rgba(242,166,60,.45);background:rgba(242,166,60,.08);color:var(--amber);font-size:12px}
.lrow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line2)}
.lrow .lic{font-family:var(--serif);font-size:15px;flex:0 0 48px;padding-top:1px}
.lrow.in .lic{color:var(--mint)}
.lrow.out .lic{color:#D98C8C}
.lrow .lbody{flex:1;min-width:0}
.lrow .lbody b{display:block;font-size:12.5px;font-weight:500;color:var(--ink)}
.lrow .lbody span{display:block;font-size:10.5px;color:var(--dim2);margin-top:2px;line-height:1.6}
.lrow .ldel{flex:none;border:0;background:transparent;color:#B97;font-size:11px;text-decoration:underline;text-underline-offset:3px;padding:2px 0}
.lrow .lnote{font-size:10.5px;color:var(--dim);margin-top:4px;line-height:1.6}

/* ---------- App 方案：今天 Hero / 路径航程 / 记录墙 ---------- */
.hero{position:relative;isolation:isolate;margin:0 -20px 0;overflow:hidden;border-bottom:1px solid var(--line);background:#070D13}
.hero-bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;filter:saturate(.92)}
.hero-shade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(3,7,11,.20) 0%,rgba(3,7,11,.72) 56%,rgba(3,7,11,.96) 100%)}
.hero-in{position:relative;z-index:2;padding:26px 20px 18px;min-height:252px;display:flex;flex-direction:column;justify-content:flex-end}
.hero-k{font-size:10px;letter-spacing:.14em;color:#E7C98F;text-transform:uppercase}
.hero h1{font-family:var(--serif);font-size:31px;line-height:1.22;font-weight:600;color:#F4EFE4;margin:8px 0 4px;max-width:300px}
.hero-sub{font-size:11.5px;line-height:1.7;color:rgba(240,235,224,.72);margin:0 0 15px;max-width:300px}
.hero-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.14);border-top:1px solid rgba(255,255,255,.14);border-bottom:1px solid rgba(255,255,255,.14);margin:0 0 14px}
.hero-nums div{background:rgba(6,10,14,.55);padding:8px 6px}
.hero-nums b{display:block;font-family:var(--serif);font-size:23px;font-weight:600;color:#F4EFE4;line-height:1}
.hero-nums span{display:block;font-size:9.5px;color:rgba(240,235,224,.68);margin-top:4px;white-space:nowrap}
.hero-btn{width:100%;padding:12px;background:var(--amber);border:1px solid var(--amber);color:var(--onAcc);font-size:12.5px;font-weight:600;letter-spacing:.04em}
.hero-note{font-size:9.5px;color:rgba(240,235,224,.55);margin-top:8px;line-height:1.6}

.orbit{display:grid;grid-template-columns:repeat(15,1fr);gap:5px;margin:14px 0 6px}

/* ===== 现场版 · 动漫角色层与高级交互 ===== */
@property --p{syntax:"<angle>";inherits:false;initial-value:0deg}
html[data-theme="app02"] body::after{
  content:"";position:fixed;inset:-15%;pointer-events:none;z-index:1;opacity:.34;
  background-image:
    radial-gradient(1.2px 1.2px at 18% 24%,rgba(239,232,219,.8),transparent 55%),
    radial-gradient(1px 1px at 72% 16%,rgba(233,166,74,.75),transparent 55%),
    radial-gradient(1.4px 1.4px at 42% 78%,rgba(116,195,161,.55),transparent 55%),
    radial-gradient(1px 1px at 88% 62%,rgba(239,232,219,.6),transparent 55%);
  background-size:220px 260px,310px 340px,390px 360px,470px 420px;
  animation:starDrift 70s linear infinite;
}
@keyframes starDrift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-26px,18px,0)}}

#scrollline{position:fixed;left:0;top:0;right:0;height:2px;z-index:80;pointer-events:none;opacity:0;transition:opacity .25s}
#scrollline i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:0 50%;background:linear-gradient(90deg,rgba(233,166,74,0),var(--amber,#E9A64A) 35%,rgba(116,195,161,.9));box-shadow:0 0 12px rgba(233,166,74,.45)}

.pageEnter{animation:pageIn .46s cubic-bezier(.2,.8,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pageEnter .pTask{animation:taskIn .56s cubic-bezier(.2,.8,.2,1) both}
.pageEnter .pTask:nth-child(2){animation-delay:.05s}
.pageEnter .pTask:nth-child(3){animation-delay:.1s}
@keyframes taskIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
[data-act]{transition:transform .13s ease,filter .2s ease,background-color .2s ease,border-color .2s ease,color .2s ease}
[data-act]:active{transform:scale(.975)}
.tab svg{transition:transform .22s cubic-bezier(.2,.8,.2,1),stroke .2s}
.tab.on svg{transform:translateY(-1px) scale(1.05)}

html[data-theme="app02"] .paperTitle::after{
  content:"";display:block;width:52px;height:2px;margin-top:11px;border-radius:2px;
  background:linear-gradient(90deg,var(--amber),rgba(233,166,74,0));
}
.dayHero{position:relative}
.dayHero::after{
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(112deg,transparent 28%,rgba(255,255,255,.07) 45%,transparent 58%);
  transform:translateX(-120%);animation:heroSheen 9s ease-in-out infinite;
}
@keyframes heroSheen{0%,70%{transform:translateX(-120%)}86%,100%{transform:translateX(120%)}}
.dayHeroImg{transform:scale(1.06) translate3d(0,0,0);will-change:transform}

.meHero{

  let ind=null, bl=0;
  IND_GROUPS.forEach(g=>{(g.items||[]).forEach(it=>{
    const n=it[0];
    if(n.length>bl && txt.indexOf(n)>=0){bl=n.length; ind={k:n,fam:g.fam,u:it[1],w:it[2]};}
  });});
  if(ind){
    const d=FAMD[ind.fam]||OTHER;
    return {k:ind.k,key:ind.fam,u:ind.u,where:ind.w,note:d.note,why:d.why,first:d.first,risk:d.risk};
  }
  let best=null,bs=0;
  JRULES.forEach(r=>{const sc=r.ks.filter(k=>txt.indexOf(k)>=0).length; if(sc>bs){bs=sc;best=r;}});
  if(best) return {k:best.k,key:best.key,u:"一单",where:best.where,note:best.note,why:best.why,first:best.first,risk:best.risk};

}

const BGDATA_KEY="cyxq_bg_data";
function fileToDataURL(file,max,quality){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        try{
          const k=Math.min(1,(max||1400)/Math.max(im.width,im.height));
          const c=document.createElement("canvas");
          c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
          c.getContext("2d").drawImage(im,0,0,c.width,c.height);
          res(c.toDataURL("image/jpeg",quality||0.72));
        }catch(e){rej(e);}
      };
      im.onerror=()=>rej(new Error("image"));
      im.src=r.result;
    };
    r.onerror=()=>rej(r.error);
    r.readAsDataURL(file);
  });
}

    if(bgURL&&bgObj) URL.revokeObjectURL(bgURL);
    bgURL=URL.createObjectURL(file); bgObj=true;
    try{localStorage.removeItem(BGDATA_KEY);}catch(e){}
    S.bg=Object.assign(bgState(),{photo:true,cover:"none"});
    save(); applyBg(); render(); return;
  }catch(e){}
  try{
    const data=await fileToDataURL(file,1400,0.72);
    localStorage.setItem(BGDATA_KEY,data);
    if(bgURL&&bgObj) URL.revokeObjectURL(bgURL);
    bgURL=data; bgObj=false;
    S.bg=Object.assign(bgState(),{photo:true,cover:"none"});
    save(); applyBg(); render();
  }catch(e2){
    alert("这张图存不进这台设备的本地存储，换一张小一点的试试。");
  }
}

function bindSheetDrag(){
  document.querySelectorAll(".proof-box").forEach(box=>{
    let drag=false,startY=0,dy=0;
    const parent=box.closest(".proof");
    const reset=()=>{box.classList.remove("dragging");box.style.transform="";if(parent) parent.classList.remove("dragging");};
    box.addEventListener("touchstart",e=>{
      if(e.target.closest("input,textarea,button,img,label")) return;
      const r=box.getBoundingClientRect();
      if(e.touches[0].clientY-r.top>68) return;
      drag=true;startY=e.touches[0].clientY;dy=0;box.classList.add("dragging");
    },{passive:true});
    box.addEventListener("touchmove",e=>{
      if(!drag) return;
      e.preventDefault();
      dy=e.touches[0].clientY-startY;
      if(dy<0) dy=0;
      box.style.transform="translateY("+dy+"px)";
      if(parent) parent.classList.toggle("dragging",dy>20);
    },{passive:false});
    const end=()=>{
      if(!drag) return; drag=false; box.classList.remove("dragging");
      if(parent) parent.classList.remove("dragging");
      if(dy>82){ const btn=box.querySelector('[data-act="pfclose"]'); if(btn) btn.click(); else reset(); }
      else reset();
    };
    box.addEventListener("touchend",end);
    box.addEventListener("touchcancel",end);
  });
}

/* ===== 自编计划：倒计时 + 动态沙漏 ===== */
const TIMERS={};
let cdLoop=null;
function fmtCd(sec){const t=Math.max(0,Math.round(sec||0));const m=Math.floor(t/60),q=t%60;return String(m).padStart(2,"0")+":"+String(q).padStart(2,"0");}
function fmtDur(sec){const t=Math.max(0,Math.round(sec||0));const m=Math.floor(t/60),q=t%60;
  if(m&&q) return m+" 分 "+q+" 秒"; if(m) return m+" 分钟"; return q+" 秒";}
function cdState(id){
  const it=(AP().mine||[]).find(x=>x.id===id);
  if(!it||!it.sec) return null;
  let st=TIMERS[id];
  if(!st){ st=TIMERS[id]={left:(it.left!=null&&it.left>0)?it.left:it.sec,running:false}; }
  return {it,st};
}
function paintCd(id){
  const o=cdState(id); if(!o) return;
  const {it,st}=o;
  const left=st.running?Math.max(0,(st.endAt-Date.now())/1000):st.left;
  const cd=document.getElementById("cd-"+id);
  if(cd){cd.textContent=fmtCd(left);cd.classList.toggle("run",!!st.running);}
  const r=it.sec?Math.min(1,Math.max(0,left/it.sec)):0;
  const tp=document.getElementById("hgt-"+id), bt=document.getElementById("hgb-"+id), sm=document.getElementById("hgs-"+id);
  if(tp) tp.style.transform="scaleY("+r.toFixed(3)+")";
  if(bt) bt.style.transform="scaleY("+(1-r).toFixed(3)+")";
  if(sm) sm.style.opacity=(st.running&&r>0)?"1":"0";
  const btn=document.querySelector('[data-act="cdrun"][data-id="'+id+'"]');
  if(btn) btn.textContent=st.running?"暂停":(left>=it.sec-0.05?"开始":"继续");
  const fcd=document.getElementById("focusCd");
  if(fcd) fcd.innerHTML=fmtCd(left)+"<small>"+(it.sec?"/ "+fmtDur(it.sec):"")+"</small>";
  const ft=document.getElementById("fgt"), fb=document.getElementById("fgb"), fs=document.getElementById("fgs");
  if(ft) ft.style.transform="scaleY("+r.toFixed(3)+")";
  if(fb) fb.style.transform="scaleY("+(1-r).toFixed(3)+")";
  if(fs) fs.style.opacity=(st.running&&r>0)?"1":"0";
  const fbtn=document.querySelector('[data-act="focusrun"]');
  if(fbtn) fbtn.textContent=st.running?"暂停":(left>=it.sec-0.05?"开始":"继续");
}
function cdTick(){
  let any=false;
  Object.keys(TIMERS).forEach(id=>{
    const st=TIMERS[id];
    if(!st||!st.running) return;
    any=true;
    if(st.endAt-Date.now()<=0){
      st.running=false; st.left=0;
      const it=(AP().mine||[]).find(x=>x.id===id);
      if(S.focus===id) closeFocus(true);
      if(it){ it.left=0; save(); }
      paintCd(id);
      cheer(it?it.title:"");
    } else {
      const sec=Math.ceil(Math.max(0,(st.endAt-Date.now())/1000));
      if(sec!==st.lastSec){ st.lastSec=sec; tickSound(); }
      paintCd(id);
    }
  });
  if(!any && cdLoop){clearInterval(cdLoop);cdLoop=null;}
}
let actx=null;
function tickSound(){
  if(S.sound===false) return;
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type="triangle"; o.frequency.value=1040;
    const t=actx.currentTime;
    g.gain.setValueAtTime(0.05,t);
    g.gain.exponentialRampToValueAtTime(0.0008,t+0.07);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+0.08);
  }catch(e){}
}
function ensureLoop(){ if(cdLoop) return; cdLoop=setInterval(cdTick,200); }
function toggleTimer(id){
  const o=cdState(id); if(!o) return;
  const {it,st}=o;
  if(st.running){
    st.left=Math.max(0,(st.endAt-Date.now())/1000); st.running=false;
    it.left=Math.round(st.left); save(); paintCd(it.id); return;
  }
  if(st.left<=0){ st.left=it.sec; it.left=it.sec; }
  st.endAt=Date.now()+st.left*1000; st.running=true; it.left=Math.round(st.left); save();
  paintCd(it.id); ensureLoop();
}
function resetTimer(id){
  const o=cdState(id); if(!o) return;
  const {it,st}=o;
  st.running=false; st.left=it.sec; it.left=it.sec; save(); paintCd(it.id); if(S.focus===id) mountFocus();
}
function closeFocus(silent){
  S.focus=null;

function proofStats(){
  const p=AP(); let cnt=0,img=0,days=0;
  for(let d=1;d<=30;d++){
    if(pDayFinal(p,d)) days++;
    for(let i=0;i<3;i++){
      const v=p.done&&p.done[d]&&p.done[d][i];
      if(v&&typeof v==="object"){cnt++; if(v.img)img++;}
    }
  }
  const mine=(p.mine||[]), md=mine.filter(x=>x.done).length;
  return {cnt,img,days,mine:mine.length,mineDone:md,notes:(p.notes||[]).length,res:(p.research||[]).length};
}
function evidenceItems(p){
  const out=[];
  Object.keys(p.done||{}).forEach(d=>{
    (p.done[d]||[]).forEach((pp,i)=>{
      if(pp&&typeof pp==="object"&&(pp.txt||pp.img||pp.num!=null)) out.push({d:+d,i,txt:pp.txt||"",num:pp.num,img:!!pp.img,at:pp.at||0});
    });
  });
  return out.sort((a,b)=>b.at-a.at);
}

/* ===== 交互 ===== */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el) return;
  const act=el.dataset.act;
  if(act==="tab"){S.justDone=0;closeFocus(false);save();location.hash="#/"+el.dataset.v;render();return;}
  if(act==="entry"){S.entry=el.dataset.v;save();render();return;}
  if(act==="start-go"){startFinish(false);return;}
  if(act==="start-later"){startFinish(true);return;}
  if(act==="open-plan"){S.planEdit=currentDay();S.proof=null;save();render();return;}
  if(act==="plan-close"){S.planEdit=0;save();render();return;}
  if(act==="ledtype"){
    S.ltype=el.dataset.v;save();
    document.querySelectorAll('[data-act="ledtype"]').forEach(b=>b.classList.toggle("on",b.dataset.v===S.ltype));
    return;
  }
  if(act==="first"){
    const d=currentDay();
    for(let i=0;i<3;i++){ if(!isDone(d,i)){ openProof(d,i); return; } }
    S.planEdit=d; save(); render(); return;
  }
  if(act==="task"){openProof(+el.dataset.d,+el.dataset.i);return;}
  if(act==="pfclose"){closeProof();return;}
  if(act==="sound"){S.sound=S.sound===false;save();render();return;}
  if(act==="savenote"){
    const t=((document.getElementById("noteTitle")||{}).value||"").trim();
    const b=((document.getElementById("noteBody")||{}).value||"").trim();
    if(!t&&!b){alert("标题或正文写一个吧。");return;}
    const p=AP(); p.notes=p.notes||[];
    p.notes.push({id:nid(),title:t||"未命名",body:b,at:nowTs()});
    save(); location.hash="#/notes"; render(); return;
  }
  if(act==="delnote"){
    if(!confirm("删掉这条笔记？")) return;
    const p=AP(); p.notes=(p.notes||[]).filter(n=>n.id!==el.dataset.id); save(); render(); return;
  }
  if(act==="saveres"){
    const g=id=>((document.getElementById(id)||{}).value||"").trim();
    const obj=g("rObj"), ch=g("rCh"), quote=g("rQuote"), price=g("rPrice"), verdict=g("rVerdict");
    if(!obj||!(quote||verdict)){alert("至少写清对象，和他说了什么或你的结论。");return;}
    const p=AP(); p.research=p.research||[];
    p.research.push({id:nid(),obj:obj,ch:ch,quote:quote,price:price,verdict:verdict,at:nowTs()});
    save(); location.hash="#/research"; render(); return;
  }
  if(act==="delres"){
    if(!confirm("删掉这条调研记录？")) return;
    const p=AP(); p.research=(p.research||[]).filter(r=>r.id!==el.dataset.id); save(); render(); return;
  }
  if(act==="mproof"){
    const it=(AP().mine||[]).find(x=>x.id===el.dataset.id); if(!it) return;
    S.proof={mine:it.id}; pfImg=null; pfDraft={txt:"",num:""}; save(); render(); return;
  }
  if(act==="pfmundo"){
    const it=(AP().mine||[]).find(x=>x.id===S.proof.mine); if(!it) return;
    if(!confirm("撤销这条完成？记录会一起删掉。")) return;
    it.done=false; delete it.proof;
    idbKvDel("proof:"+AP().id+":mine-"+it.id).catch(()=>{});
    S.proof=null; pfImg=null; pfDraft={txt:"",num:""}; save(); render(); return;
  }
  if(act==="plan-save"){
    const day=S.planEdit; if(!day) return;
    const oldT=pTasks(AP(),day);
    const t=[0,1,2].map(i=>((document.getElementById("pe"+i)||{}).value||"").trim());
    const why=((document.getElementById("peWhy")||{}).value||"").trim();
    if(t.some(x=>x.replace(/\s/g,"").length<4)){alert("三件都要写清楚，至少 4 个字。");return;}
    if(new Set(t).size<3){alert("三件不能重复。换一件你真正要做的。");return;}
    if(why.replace(/\s/g,"").length<5){alert("写一句为什么今天做这三件，至少 5 个字。系统不替你决定。");return;}
    const changed=t.some((x,i)=>x!==oldT[i]);
    const p=AP();
    p.plan[day]=t; p.why[day]=why;
    if(changed){delete p.done[day]; S.justDone=0;}
    if(pDayFinal(p,day)){S.justDone=day;S.showDiag=false;}
    S.planEdit=0; save(); render(); return;
  }
  if(act==="ledadd"){
    const amt=Number(((document.getElementById("lAmt")||{}).value||"").trim());
    const cat=((document.getElementById("lCat")||{}).value||"").trim();
    const note=((document.getElementById("lNote")||{}).value||"").trim();
    if(!(amt>0)){alert("金额要大于 0。");return;}
    if(!cat){alert("写一个类别，比如营业收入、原料、房租。");return;}
    const p=AP(); p.ledger=p.ledger||[];
    p.ledger.push({id:"l"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),type:S.ltype||"in",amount:amt,cat:cat.slice(0,20),note:note.slice(0,60),at:Date.now()});
    save(); render(); return;
  }
  if(act==="leddel"){
    const p=AP(); const e=(p.ledger||[]).find(x=>x.id===el.dataset.id); if(!e) return;
    if(!confirm("删除这一笔？"+(e.type==="in"?"收入":"支出")+" "+fmtMoney(e.amount)+" · "+e.cat+"\n\n只删这一笔，其他流水不动。")) return;
    p.ledger=(p.ledger||[]).filter(x=>x.id!==e.id);
    save(); render(); return;
  }
  if(act==="pfminesubmit"){
    const it=(AP().mine||[]).find(x=>x.id===S.proof.mine); if(!it) return;
    const elx=document.getElementById("pfTxt");
    const txt=(elx?elx.value:pfDraft.txt||"").trim();
    if(txt.length<8 && !pfImg){alert("写一句实际做了什么，至少 8 个字；或者拍一张照片。");return;}
    it.done=true; it.proof={at:Date.now(),txt:txt.slice(0,300),img:!!pfImg};
    if(pfImg) idbKvPut("proof:"+AP().id+":mine-"+it.id,pfImg).catch(()=>{});
    pfImg=null; pfDraft={txt:"",num:""}; S.proof=null; save(); render(); return;
  }
  if(act==="pfrmimg"){pfImg=null;render();return;}
  if(act==="pfundo"){
    const o=S.proof; if(!o) return;
    if(!confirm("撤销这条完成？记录会一起删掉。")) return;
    const p=AP(); p.done[o.d]=p.done[o.d]||[false,false,false];
    p.done[o.d][o.i]=false;
    idbKvDel(proofKey(o.d,o.i)).catch(()=>{});
    S.proof=null; pfImg=null; pfDraft={txt:"",num:""}; S.justDone=0; save(); render(); return;
  }
  if(act==="pfsubmit"){
    const o=S.proof; if(!o) return;
    const {d,i}=o, task=taskText(d,i), need=needNum(task);
    const ta=document.getElementById("pfTxt");
    const txt=(ta?ta.value:pfDraft.txt||"").trim();
    const ni=document.getElementById("pfNum");
    const raw=(ni?ni.value:pfDraft.num||"").trim();
    if(txt.length<8 && !pfImg){alert("至少 8 个字，或者一张照片。");return;}
    if(need && (raw==="" || isNaN(Number(raw)))){alert("这条要填一个数字：几个、多少钱、多久，都算。");return;}
    const p=AP(); p.done[d]=p.done[d]||[false,false,false];
    p.done[d][i]={at:Date.now(),txt:txt.slice(0,300),num:(ni&&raw!==""?Number(raw):null),img:!!pfImg};
    if(pfImg) idbKvPut(proofKey(d,i),pfImg).catch(()=>{});
    pfImg=null; pfDraft={txt:"",num:""}; S.proof=null;
    if(pDayDone(p,d)&&pWhy(p,d).length<5){
      S.planEdit=d; save(); render();
      setTimeout(()=>alert("三件记录齐了，还差一句：为什么今天做这三件。"),30);
      return;
    }
    if(pDayFinal(p,d)){S.justDone=d;S.showDiag=false;}
    save(); render(); return;
  }
  if(act==="pathw"){S.pathW=+el.dataset.w;S.open=0;save();render();return;}
  if(act==="day"){const d=+el.dataset.d;S.pathW=chapOf(d);S.open=S.open===d?0:d;save();render();return;}
  if(act==="mscope"){S.ms=el.dataset.v;save();render();return;}
  if(act==="addmine"){
    const p=AP(), t=(document.getElementById("mtitle")||{}).value||"";
    const sc=S.ms||"day";
    let due="";
    if(sc==="month"){
      const y=((document.getElementById("myear")||{}).value||"").trim();
      const m=((document.getElementById("mmon")||{}).value||"").trim();
      due=(y||new Date().getFullYear())+"-"+String(m||1).padStart(2,"0");
    }else{
      due=((document.getElementById("mdue")||{}).value||"").trim();
    }
    if(!t.trim()){alert("先写一句要做的事。");return;}
    if(sc!=="year"&&!due){alert("选一个日期。");return;}
    const mins=Math.max(0,Math.min(600,Math.floor(+(document.getElementById("mdmin")||{}).value||0)));
    const secs=Math.max(0,Math.min(59,Math.floor(+(document.getElementById("mdsec")||{}).value||0)));
    const dur=mins*60+secs;
    S.mdmin=mins; S.mdsec=secs;
    if(sc==="day") S.mday=due;
    if(sc==="month"){const q=due.split("-");S.myear=+q[0];S.mmon=+q[1];}
    if(sc==="year") S.myear=+due||S.myear;
    p.mine.push({id:"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),
      title:t.trim().slice(0,60),scope:sc,due:sc==="year"?(due||String(new Date().getFullYear())):due,
      done:false,created:Date.now(),sec:dur,left:dur});
    save();location.hash="#/mine";render();return;
  }
  if(act==="togglemine"){
    const p=AP(), it=p.mine.find(x=>x.id===el.dataset.id);
    if(it){it.done=!it.done;save();render();}
    return;
  }
  if(act==="delmine"){
    const p=AP(), it=p.mine.find(x=>x.id===el.dataset.id);
    if(!it) return;
    if(!confirm("删掉「"+it.title+"」？")) return;
    p.mine=p.mine.filter(x=>x.id!==it.id);save();render();return;
  }
  if(act==="cdrun"){
    const id=el.dataset.id, o=cdState(id);
    const wasRunning=!!(o&&o.st.running);
    toggleTimer(id);
    if(o&&!wasRunning){S.focus=id;save();mountFocus();}
    return;
  }
  if(act==="cdreset"){resetTimer(el.dataset.id);return;}
  if(act==="focusrun"){toggleTimer(S.focus);return;}
  if(act==="focusreset"){resetTimer(S.focus);return;}
  if(act==="focusclose"){closeFocus();return;}
  if(act==="cheerclose"){ closeCheer(); return; }
  if(act==="boot-start"){S.booted=true;save();location.hash="#/start";S.step=0;render();return;}
  if(act==="boot-skip"){S.booted=true;save();location.hash="#/today";render();return;}
  if(act==="chip"){AP().ans[el.dataset.k]=el.dataset.v;save();render();return;}
  if(act==="picker"){S.pick=true;save();render();return;}
  if(act==="pickclose"){S.pick=false;save();render();return;}
  if(act==="pick"){AP().ans.field=el.dataset.v;S.pick=false;save();render();return;}
  if(act==="next"){
    if(S.step<QS.length-1){S.step++;save();render();return;}
    const pn=AP();
    pn.name=planName(pn.ans,S.plans.filter(x=>x.id!==pn.id&&x.ans.field===pn.ans.field).length);
    S.onboarded=true;S.showDiag=true;S.step=0;save();location.hash="#/today";render();return;
  }
  if(act==="back"){if(S.step>0){S.step--;save();render();}return;}
  if(act==="savediag"){S.showDiag=false;save();render();return;}
  if(act==="re-onb"){S.step=0;S.showDiag=false;save();location.hash="#/start";render();return;}
  if(act==="save"){
    const ta=document.getElementById("rv");
    if(ta){const week=dlist()[currentDay()-1].w;AP().review["w"+week]=ta.value;save();}
    el.textContent="已保存";el.style.color="#6FD9BE";el.style.borderColor="rgba(111,217,190,.4)";return;
  }
  if(act==="newplan"){
    const p=AP();
    if(!Object.keys(p.ans).length&&!Object.keys(p.done).length){
      S.onboarded=false;S.entry="lost";S.pick=false;S.step=0;S.showDiag=false;S.justDone=0;S.open=0;
      save();location.hash="#/start";render();return;
    }
    if(!confirm("开始一个新计划？\n\n「"+p.name+"」会存进「我的计划」，之后随时能翻回来，不会清掉。")) return;
    p.closed=true;p.closedAt=Date.now();
    const np=newPlan();S.plans.push(np);S.activeId=np.id;
    S.onboarded=false;S.entry="lost";S.pick=false;S.step=0;S.showDiag=false;S.justDone=0;S.open=0;S.pathW=0;
    save();location.hash="#/start";render();return;
  }
  if(act==="renameplan"){
    const p=S.plans.find(x=>x.id===el.dataset.id);
    if(!p) return;
    const v=prompt("给这份计划起个名字",p.name);
    if(v&&v.trim()){p.name=v.trim().slice(0,20);save();render();}
    return;
  }
  if(act==="delplan"){
    const p=S.plans.find(x=>x.id===el.dataset.id);
    if(!p) return;
    const cur=p.id===S.activeId;
    const msg=cur
      ? "这是当前正在走的计划。删掉它，这份的档案、30 天打卡、周复盘会一起没，不能恢复。\n\n确定删除「"+p.name+"」？"
      : "删除「"+p.name+"」？这份的打卡和复盘会一起没，其他计划不受影响。";
    if(!confirm(msg)) return;
    S.plans=S.plans.filter(x=>x.id!==p.id);
    if(!S.plans.length){const np=newPlan();S.plans=[np];S.activeId=np.id;S.onboarded=false;S.step=0;}
    else if(!S.plans.find(x=>x.id===S.activeId)){S.activeId=S.plans[S.plans.length-1].id;}
    const ap=AP();
    S.onboarded=!!ap.started;
    S.justDone=0;S.open=0;S.showDiag=false;
    save();render();return;
  }
  if(act==="switchplan"){
    const p=S.plans.find(x=>x.id===el.dataset.id);
    if(!p) return;
    S.activeId=p.id;
    S.onboarded=!!p.started;
    S.pathW=0;S.justDone=0;S.open=0;S.showDiag=false;
    if(p.closed&&pCompleted(p)<30) p.closed=false;
    save();location.hash="#/today";render();return;
  }
  if(act==="copylink"){
    const u=location.href;
    const done=()=>alert("链接已复制，可以直接发给朋友：\n\n"+u);
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(u).then(done).catch(()=>{fallbackCopy(u);done();});
    }else{fallbackCopy(u);done();}
    return;
  }
  if(act==="group"){alert("原型阶段还没有群。这里会放一个真实的群二维码。");return;}
  if(act==="remind"){
    const r=remState(); r.on=!r.on;
    if(r.on&&"Notification" in window&&Notification.permission==="default"){
      try{Notification.requestPermission();}catch(e){}
    }
    S.reminder=r;save();render();return;
  }
  if(act==="theme"){S.bg=Object.assign(bgState(),{theme:el.dataset.v});save();applyBg();render();return;}
  if(act==="cover"){S.bg=Object.assign(bgState(),{cover:el.dataset.v,photo:false});save();applyBg();render();return;}
  if(act==="bgclear"){
    idbDel().catch(()=>{});
    try{localStorage.removeItem(BGDATA_KEY);}catch(e){}
    if(bgURL&&bgObj){URL.revokeObjectURL(bgURL);}
    bgURL=null;
    S.bg=Object.assign(bgState(),{photo:false,cover:"none"});
    save();applyBg();render();return;
  }
});

document.addEventListener("change",e=>{
  if(e.target.id==="pfTxt"){pfDraft.txt=e.target.value;return;}
  if(e.target.id==="pfNum"){pfDraft.num=e.target.value;return;}
  if(e.target.id==="scrim"){S.bg=Object.assign(bgState(),{scrim:parseFloat(e.target.value)});save();return;}
  if(e.target.id==="remindTime"){const r=remState();r.time=e.target.value||"20:00";S.reminder=r;save();return;}
  if(e.target.id==="bgin"){handleUpload(e.target.files&&e.target.files[0]);}
  if(e.target.id==="pfimg"){
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    fileToDataURL(f,1000,0.62).then(u=>{pfImg=u;render();}).catch(()=>alert("这张图读不了，换一张试试。"));
  }
});

document.addEventListener("input",e=>{
  if(e.target.id==="pfTxt"){pfDraft.txt=e.target.value;return;}
  if(e.target.id==="pfNum"){pfDraft.num=e.target.value;return;}
  if(e.target.id==="qa"){
    const k=e.target.dataset.k, v=e.target.value;
    if(v.trim()) AP().ans[k]=v; else delete AP().ans[k];
    save();
    const btn=document.querySelector("[data-act='next']");
    if(btn) btn.disabled=!v.trim();
    return;
  }
  if(e.target.id==="scrim"){
    const scrim=document.getElementById("bgscrim");
    if(scrim) scrim.style.opacity=e.target.value;
    const lab=e.target.nextElementSibling;
    if(lab&&lab.classList.contains("lab")) lab.textContent=Math.round(parseFloat(e.target.value)*100)+"%";
  }
});

function remindTick(){
  const r=remState(); if(!r.on) return;
  if(dayDone(currentDay())) return;
  const now=new Date(); const hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  const date=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
  if(hm<r.time||r.last===date) return;
  r.last=date; S.reminder=r; save();
  const body="今天的三件还差记录。";
  try{
    if("Notification" in window&&Notification.permission==="granted") new Notification("创业星球",{body});
    else alert("创业星球：\n\n"+body);
  }catch(e){}
}
function haptic(ms){
  try{
    if(!navigator.vibrate) return;
    if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    navigator.vibrate(ms||5);
  }catch(e){}
}
document.addEventListener("pointerdown",e=>{
  if(e.target.closest("[data-act]")) haptic(6);
},{passive:true});

let scrollTick=false;
function onScroll(){
  scrollTick=false;
  const line=document.getElementById("scrollline");
  const max=Math.max(1,document.documentElement.scrollHeight-window.innerHeight);
  const p=Math.min(1,Math.max(0,window.scrollY/max));
  if(line){
    line.style.opacity=p>.02?"1":"0";
    const bar=line.querySelector("i");
    if(bar) bar.style.transform="scaleX("+p.toFixed(4)+")";
  }
  const hero=document.querySelector(".dayHeroImg");
  if(hero&&window.scrollY<520){
    const y=Math.min(54,window.scrollY*.16);
    hero.style.transform="scale(1.08) translate3d(0,"+y.toFixed(1)+"px,0)";
  }
}
window.addEventListener("scroll",()=>{ if(!scrollTick){scrollTick=true;requestAnimationFrame(onScroll);} },{passive:true});
window.addEventListener("hashchange",render);
loadBgImage();
render();
setInterval(remindTick,30000); setTimeout(remindTick,800);

</script>
</body>
